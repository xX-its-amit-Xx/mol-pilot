[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molpilot"
version = "0.1.0"
description = "A medicinal-chemist-facing molecular design copilot"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "MolPilot Contributors" }]
keywords = [
    "cheminformatics",
    "drug-discovery",
    "ADMET",
    "molecular-design",
    "interpretability",
    "matched-molecular-pairs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rdkit>=2023.3",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "shap>=0.43",
    "streamlit>=1.28",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "joblib>=1.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gnn = ["torch>=2.0", "torch-geometric>=2.4"]
tdc = ["PyTDC>=1.1"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.1"]

[project.scripts]
molpilot = "mol_pilot.cli:main"

[project.urls]
Homepage = "https://github.com/molpilot/molpilot"
Issues = "https://github.com/molpilot/molpilot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mol_pilot*"]

[tool.setuptools.package-data]
mol_pilot = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
